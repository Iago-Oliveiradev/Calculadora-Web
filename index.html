<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="titulo">
            <h1>Calculadora</h1>
        </div>

        <div class="calculadora">

            <input type="text" id="visor" value="" placeholder="0" readonly>

            <div class="botoes">
                <button class="tecla">CE</button>
                <button class="tecla">DEL</button>
                <button class="tecla operador">/</button>
                <button class="tecla operador">*</button>
                <button class="tecla">7</button>
                <button class="tecla">8</button>
                <button class="tecla">9</button>
                <button class="tecla operador">-</button>
                <button class="tecla">4</button>
                <button class="tecla">5</button>
                <button class="tecla">6</button>
                <button class="tecla operador">+</button>
                <button class="tecla">1</button>
                <button class="tecla">2</button>
                <button class="tecla">3</button>
                <button class="tecla igual">=</button>
                <button class="tecla zero">0</button>
                <button class="tecla">.</button>
                </div>
            </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
